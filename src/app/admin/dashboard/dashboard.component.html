<div class="container mt-3">
    <h2>Admin Dashboard</h2>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Author</th>
                <th>Title</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            <tr *ngFor="let post of posts">
                <td>{{ post.name }}</td>
                <td>{{ post.title }}</td>
                <td>{{ post.status }}</td>
                <td [innerHTML]="post.description"> </td>

                <td>
                    <button *ngIf="post.status==='Pending'" class="btn btn-success btn-sm"
                        (click)="approvePost(post.postId)">
                        Approve
                    </button>
                    <button *ngIf="post.status==='Pending'" class="btn btn-warning btn-sm ms-2"
                        (click)="rejectPost(post.postId)">
                        Reject
                    </button>
                    <button *ngIf="post.status==='Approved'" class="btn btn-danger btn-sm ms-2"
                        (click)="deletePost(post.postId)">
                        Delete
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
