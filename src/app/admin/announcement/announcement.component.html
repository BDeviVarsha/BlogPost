<div class="card">
    <form [formGroup]="announceForm" (ngSubmit)="createAnnounce()">
        <div>
            <label for="title">Title: </label>
            <input type="text" id="title" formControlName="title">
            <div *ngIf="announceForm.controls['title'].touched && announceForm.controls['title'].invalid" class="text-danger">
                Enter a title
            </div>
        </div>
        <div>
            <label for="desc">Description: </label>
            <ckeditor id="desc" [editor]="Editor" formControlName="description" [config]="editorConfig"></ckeditor>
            <div *ngIf="announceForm.controls['description'].touched && announceForm.controls['description'].invalid" class="text-danger">
                Enter the description
            </div>
        </div>
        <div>
            <label for="pin">
            <input type="checkbox" formControlName="is_pinned" id="pin">
            Pin to top</label>
        </div>
        <button class="mb-3" type="submit" [disabled]="announceForm.invalid"> {{isEditMode? 'Update announcement': 'Create Post'}} </button>

        <button type="button" *ngIf="isEditMode" (click)="cancelEdit()">
      Cancel
    </button>
    </form>
</div>
