<div>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div>
            <label for="name">Name: </label>
            <input type="text" id="name" formControlName="name">
            <div *ngIf="loginForm.controls['name'].touched && loginForm.controls['name'].invalid" class="text-danger">
                Name is required
            </div>
        </div>
        <div>
            <label for="phoneNo">Mobile Number: </label>
            <input type="number" id="phoneNo" formControlName="phoneNo">
            <div *ngIf="loginForm.controls['phoneNo'].touched && loginForm.controls['phoneNo'].invalid" class="text-danger">
                Enter a valid mobile number
            </div>
        </div>
        <div>
            <label for="role">Role: </label>
            <select id="role" formControlName="role">
                <option value="">Select a role</option>
                <option *ngFor="let role of roles" [value]="role.name">{{ role.name }}</option>
            </select>
            <div *ngIf="loginForm.controls['role'].touched && loginForm.controls['role'].invalid" class="text-danger">
                Role is required
            </div>
        </div>
        <button type="submit">Login</button>
    </form>
</div>
