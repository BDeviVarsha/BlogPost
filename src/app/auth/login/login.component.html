<p>login works!</p>
<div>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div>
            <label for="phoneNo">Mobile Number: </label>
            <input type="number" id="phoneNo" formControlName="phoneNo">
            <div *ngIf="loginForm.controls['phoneNo'].touched && loginForm.controls['phoneNo'].invalid" class="text-danger">
                Enter a valid mobile number
            </div>
        </div>
        <div>
            <label for="role">Role: </label>
            <input type="text" id="role" formControlName="role">
            <div *ngIf="loginForm.controls['role'].touched && loginForm.controls['role'].invalid">
                Role is required
            </div>
        </div>
        <button type="submit">Login</button>
    </form>
</div>
