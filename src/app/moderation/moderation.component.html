<h2>Pending Anonymous Posts</h2>
<div *ngFor="let post of pendingPosts" class="post-card border p-3 mb-3">
    <h5>{{ post.name }}</h5>
    <div class="border p-3 mb-3">
        <h4>{{ post.title }}</h4>
        <div [innerHTML]="post.description"></div>

        <ng-container *ngFor="let filePath of getPostFiles(post)">
            <ng-container *ngIf="getFileUrl(filePath) as fileUrl">
                <ng-container *ngIf="isImage(filePath)">
                    <img [src]="fileUrl" alt="Post Image" style="max-width:200px" /> &nbsp;
                </ng-container>

                <ng-container *ngIf="isAudio(filePath)">
                    <audio controls>
                        <source [src]="fileUrl" type="audio/mpeg" /> &nbsp;
                    </audio>
                </ng-container>

                <ng-container *ngIf="isVideo(filePath)">
                    <video controls>
                        <source [src]="fileUrl" type="video/mp4" /> &nbsp;
                    </video>
                </ng-container>

                <ng-container *ngIf="!isImage(filePath) && !isAudio(filePath) && !isVideo(filePath)">
                    <a [href]="fileUrl" target="_blank">{{ getFileName(filePath) }}</a>
                </ng-container>
            </ng-container>
        </ng-container>
        <br>
        <button (click)="approve(post.postId)">Approve</button>

        <button (click)="openReject(post.postId)">Reject</button>

        <div *ngIf="selectedPostId === post.postId" class="mt-2">

            <select [(ngModel)]="selectedReason">
                <option value="">Select reason</option>
                <option *ngFor="let r of reasons" [value]="r">{{ r }}</option>
            </select>

            <div *ngIf="selectedReason === 'Other'">
                <input type="text" [(ngModel)]="customReason" placeholder="Enter reason" />
            </div>

            <button (click)="confirmReject(post.postId)">Submit</button>
        </div>
    </div>
</div>
