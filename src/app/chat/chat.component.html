<div class="chat-app">
  <!-- User list -->
  <div class="user-list">
    <div *ngFor="let user of users" 
         class="user-item" 
         [ngClass]="{'active': user.id === activeUserId}"
         (click)="selectUser(user)">
      <!-- <img [src]="user.avatarUrl" class="avatar" /> -->
      <div class="user-info">
        <div class="user-name">{{ user.name }}</div>
        <div class="user-status" [ngClass]="{'online': user.isOnline, 'offline': !user.isOnline}">
          {{ user.isOnline ? 'Online' : 'Offline' }}
        </div>
      </div>
    </div>
  </div>

  <!-- Chat window -->
  <div class="chat-window">
    <div class="chat-header">
      <!-- <img [src]="activeUser.avatarUrl" class="avatar" /> -->
      <div class="chat-user-info">
        <div class="user-name">{{ activeUser?.name }}</div>
        <div class="user-status" [ngClass]="{'online': activeUser?.isOnline, 'offline': !activeUser?.isOnline}">
          {{ activeUser?.isOnline ? 'Online' : 'Offline' }}
        </div>
      </div>
    </div>

    <div class="chat-messages" #messageContainer>
      <div *ngFor="let msg of messages" 
           [ngClass]="{'my-message': msg.senderId === userId, 'friend-message': msg.senderId !== userId}">
        <div class="message-bubble">
          {{ msg.content }}
          <span class="timestamp">{{ msg.timestamp | date:'shortTime' }}</span>
          <span class="seen" *ngIf="msg.senderId === userId">{{ msg.seen ? '✓✓' : '✓' }}</span>
        </div>
      </div>
      <div class="typing-indicator" *ngIf="isTyping">{{ activeUser.name }} is typing...</div>
    </div>

    <div class="chat-input">
      <input type="text" placeholder="Type a message..." [(ngModel)]="newMessage" (keyup.enter)="sendMessage()" (input)="sendTyping()" />
      <button (click)="sendMessage()">Send</button>
    </div>
  </div>
</div>
