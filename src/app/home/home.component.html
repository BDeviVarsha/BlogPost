<p>Home works</p>
<div *ngFor="let post of Posts">
    <h5>{{ post.name }}</h5>
    <div class="border p-3">
        <h4>{{ post.title }}</h4>
        <div [innerHTML]="post.description"></div>

        <div *ngIf="post.filepath">
            <ng-container *ngIf="isImage(post.filepath)">
                <img [src]="getFileUrl(post.filepath)" alt="Post Image" style="max-width:200px" />
            </ng-container>

            <ng-container *ngIf="isAudio(post.filepath)">
                <audio controls>
                    <source [src]="getFileUrl(post.filepath)" type="audio/mpeg" />
                </audio>
            </ng-container>

            <!-- <ng-container *ngIf="isText(post.filepath)">
                        <a [href]="getFileUrl(post.filepath)" target="_blank">View Text File</a>
                    </ng-container> -->

            <ng-container *ngIf="!isImage(post.filepath) && !isAudio(post.filepath)">
                <a [href]="getFileUrl(post.filepath)" target="_blank">
                    {{ getFileName(post.filepath) }}
                </a>
            </ng-container>
        </div>
    </div>
</div>
