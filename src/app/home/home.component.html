<!-- <p>Home works</p> -->
<div *ngFor="let post of Posts">
    <h5>{{ post.name }}</h5>
    <div class="border p-3">
        <h4>{{ post.title }}</h4>
        <div [innerHTML]="post.description"></div>

        <ng-container *ngIf="getFileUrl(getPostFilePath(post)) as fileUrl">
            <ng-container *ngIf="isImage(getPostFilePath(post))">
                <img [src]="fileUrl" alt="Post Image" style="max-width:200px" />
            </ng-container>

            <ng-container *ngIf="isAudio(getPostFilePath(post))">
                <audio controls>
                    <source [src]="fileUrl" type="audio/mpeg" />
                </audio>
            </ng-container>

            <ng-container *ngIf="isVideo(getPostFilePath(post))">
                <video controls>
                    <source [src]="fileUrl" type="video/mp4" />
                </video>
            </ng-container>

            <ng-container *ngIf="!isImage(getPostFilePath(post)) && !isAudio(getPostFilePath(post)) && !isVideo(getPostFilePath(post))">
                <a [href]="fileUrl" target="_blank">
                    {{ getFileName(getPostFilePath(post)) }}
                </a>
            </ng-container>
        </ng-container>
    </div>
</div>
