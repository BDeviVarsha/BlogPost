<header class="navbar">
    <div class="nav-left">
        <a routerLink="/" class="logo">BlogPost</a>
    </div>

    <div class="nav-right">
        <a routerLink="/">Home</a>
        <a routerLink="/AddPost">Add Post</a>

        <!-- Not logged in -->
        <ng-container *ngIf="!isLoggedIn">
            <a routerLink="/Login" class="btn-outline">Login</a>
            <a routerLink="/Register" class="btn-primary">Register</a>
        </ng-container>

        <!-- Logged in -->
        <ng-container *ngIf="isLoggedIn">

            <a routerLink="/Chat" class="icon">
                <i class="bi bi-chat-dots"></i>
            </a>

            <!-- Moderator -->
            <a *ngIf="user?.role === 'Moderator'" routerLink="/Moderation">
                Requests
            </a>

            <!-- Admin -->
            <a *ngIf="user?.role === 'Admin'" routerLink="/Admin">
                Dashboard
            </a>

            <a routerLink="/MyPosts">My Posts</a>

            <!-- User dropdown -->
            <div class="user-menu" (click)="toggleMenu()">
                <span>{{ user?.name }}</span>
                <i class="bi bi-caret-down-fill"></i>

                <div class="dropdown" *ngIf="isOpen">
                    <a routerLink="/profile">Profile</a>
                    <a (click)="logout()">Logout</a>
                </div>
            </div>
        </ng-container>
    </div>
</header>
